services:
  # Hybrid dev mode: the API normally runs on the host (PyCharm green-run /
  # `uv run uvicorn ...`). This service is gated behind the "full" profile so
  # `docker compose up` only starts postgres + redis. Use it for the occasional
  # all-in-container / parity run: `docker compose --profile full up`.
  api:
    profiles: ["full"]
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    # Iteration 1 only depends on Claude — no DB/Redis wiring here. The
    # depends_on + DATABASE_URL/REDIS_URL injection returns in iteration 3.
    command: uv run uvicorn fastapi_app_01.main:app --host 0.0.0.0 --port 8000 --reload
    # uv-recommended hot reload: sync source into the container, rebuild on dep
    # changes. Run with `docker compose --profile full watch`.
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
          ignore:
            - .venv/
        - action: rebuild
          path: ./pyproject.toml

  postgres:
    # 直接用內建 pgvector 的官方映像檔,省去自行安裝擴充套件
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    # Bind to localhost only — don't expose the dev DB to the local network.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata-fastapi-app-01:/var/lib/postgresql/data
      # 容器第一次啟動時自動執行此 SQL (啟用 vector 擴充 + 建表)
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    # Bind to localhost only.
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Iteration 3: opt-in graphical chat UI over the OpenAI-compatible /v1 endpoints.
  # Gated behind its own "webui" profile so default `docker compose up` ignores it.
  # OPENAI_API_BASE_URL defaults to the host's API (hybrid mode: API on host via
  # `--host 0.0.0.0`); for the all-in-container run override it to the service name:
  #   OPENWEBUI_API_BASE=http://api:8000/v1 docker compose --profile full --profile webui up
  # No depends_on (sticking with compose B's spirit — in hybrid mode `api` isn't in compose).
  openwebui:
    profiles: ["webui"]
    image: ghcr.io/open-webui/open-webui:main
    ports:
      - "3000:8080"
    environment:
      OPENAI_API_BASE_URL: ${OPENWEBUI_API_BASE:-http://host.docker.internal:8000/v1}
      OPENAI_API_KEY: dummy  # we don't validate Authorization (D6)
    extra_hosts:
      - "host.docker.internal:host-gateway"  # let the container reach the host (also on Linux)
    volumes:
      - openwebui-data:/app/backend/data  # persist login / settings across restarts

volumes:
  pgdata-fastapi-app-01:
  openwebui-data:
